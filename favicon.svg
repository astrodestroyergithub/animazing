<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C14"/>
      <stop offset="50%" stop-color="#15182B"/>
      <stop offset="100%" stop-color="#090A10"/>
    </linearGradient>
    <linearGradient id="crimsonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85"/>
      <stop offset="55%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="bladeGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hexagonal Rounded Shield Base -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" stroke="url(#crimsonCyan)" stroke-width="3"/>
  <!-- Subtle Inner Cyber Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.45"/>
  <!-- Stylized Anime 'A' Monogram & Kitsune Crest -->
  <path d="M32 11 L15 50 L23.5 50 L27.5 40 L36.5 40 L40.5 50 L49 50 Z" fill="url(#crimsonCyan)" filter="url(#neonGlow)"/>
  <!-- Inner Cutout of 'A' -->
  <polygon points="32,22 28.5,33 35.5,33" fill="#0D0F1C"/>
  <!-- Dynamic Katana Slash & Play Spark -->
  <path d="M11 45 Q32 28 53 17" fill="none" stroke="url(#bladeGlow)" stroke-width="3.2" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Glowing Four-Point Anime Star Spark -->
  <path d="M48 14 L49.5 18.5 L54 20 L49.5 21.5 L48 26 L46.5 21.5 L42 20 L46.5 18.5 Z" fill="#00F0FF"/>
</svg>
